# Verificador externo do cordiumhub.com.br — AC-E14-03.
#
# Por que GitHub Actions e não um serviço de monitoramento: não exige criar conta em lugar novo,
# não exige cartão, e roda FORA do host — que é o ponto. Em 09/09 a máquina ficou 4 horas fora e o
# monitoramento caiu junto com ela, porque morava nela.
#
# Este arquivo vive em cordium-git/alertas-cordium, repositório **público**: a conta de minutos do
# Actions é ilimitada em repositório público e limitada a 2.000 min/mês em privado — uma checagem a
# cada 5 minutos consome ~8.600 min/mês, ou seja, em repositório privado isso viraria fatura. O
# repositório tem só este arquivo e um README: a URL conferida é pública de qualquer forma, e nenhum
# segredo fica no código (o webhook vai em Settings > Secrets and variables > Actions).
#
# COMO ELE AVISA: só na MUDANÇA de estado, não a cada checagem. Na primeira falha ele abre uma issue
# e manda o alerta; enquanto o site seguir fora, fica calado; quando voltar, fecha a issue e manda o
# aviso de volta. Assim uma queda de 4 horas dá duas mensagens, não 48. A issue aberta é o estado e
# o registro do incidente, e o app do GitHub no celular avisa por conta própria quando o job falha.
#
# Sem o segredo DISCORD_WEBHOOK ele ainda funciona: abre e fecha a issue, e falha o job. O aviso no
# celular pelo Discord é que não sai.

name: vigia externo do cordiumhub

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (o Actions pode atrasar alguns minutos sob carga)
  workflow_dispatch: {}     # permite disparar à mão, para testar
  push:                     # e a cada push: o primeiro agendamento de um repositório novo pode
    branches: [main]        # demorar mais de uma hora para engatar, e mudança no vigia tem de
                            # ser provada na hora em que é feita, não no próximo ciclo

permissions:
  issues: write             # a issue aberta é o estado: evita repetir alerta a cada 5 minutos

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o site três vezes antes de acreditar
        id: checagem
        run: |
          URL="https://cordiumhub.com.br"
          ok=0
          codigo=000
          for tentativa in 1 2 3; do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || echo 000)
            echo "tentativa $tentativa: HTTP $codigo"
            if [ "$codigo" = "200" ]; then ok=1; break; fi
            [ "$tentativa" = "3" ] || sleep 20
          done
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "no_ar=$ok" >> "$GITHUB_OUTPUT"

      - name: Avisar, mas só quando o estado muda
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NO_AR: ${{ steps.checagem.outputs.no_ar }}
          CODIGO: ${{ steps.checagem.outputs.codigo }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          TITULO="cordiumhub.com.br fora do ar"
          # O estado é a issue aberta com este título. Procuro pelo título, e não por etiqueta,
          # para não depender de uma etiqueta existir no repositório.
          aberta=$(gh issue list --repo "$REPO" --state open --search "\"$TITULO\" in:title" \
                     --json number,title \
                     --jq "[.[] | select(.title == \"$TITULO\")] | .[0].number // empty")

          avisar() {
            if [ -z "${WEBHOOK:-}" ]; then
              echo "sem DISCORD_WEBHOOK: só a issue foi usada"
              return 0
            fi
            jq -Rn --arg t "$1" '{content: $t}' \
              | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK" >/dev/null
          }

          if [ "$NO_AR" = "0" ] && [ -z "$aberta" ]; then
            gh issue create --repo "$REPO" --title "$TITULO" \
              --body "Três checagens seguidas falharam, com 20s entre elas. Última resposta: HTTP $CODIGO.

            Conferido de fora do host, pelo GitHub Actions. Esta issue é o estado do vigia: ela é
            fechada sozinha quando o site voltar a responder 200."
            avisar "🔴 **cordiumhub.com.br está fora do ar.** Três checagens seguidas falharam (HTTP $CODIGO). Conferido de fora do host."
            echo "incidente aberto"
          elif [ "$NO_AR" = "1" ] && [ -n "$aberta" ]; then
            gh issue close "$aberta" --repo "$REPO" --comment "Voltou: HTTP 200."
            avisar "🟢 **cordiumhub.com.br voltou.** O site responde 200 de novo."
            echo "incidente fechado"
          else
            echo "sem mudança de estado (no_ar=$NO_AR, incidente aberto=${aberta:-nenhum})"
          fi

      - name: Falhar o job quando o site está fora, para o app do celular avisar também
        if: steps.checagem.outputs.no_ar == '0'
        run: |
          echo "::error::cordiumhub.com.br não respondeu 200 (HTTP ${{ steps.checagem.outputs.codigo }})"
          exit 1
